version: "3.8"

services:
  postgres:
    image: postgres:14
    container_name: timetracker_postgres_dev
    environment:
      POSTGRES_USER: yourusername
      POSTGRES_PASSWORD: GvXWmzMLP03HNmrp
      POSTGRES_DB: nestdb
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourusername"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: timetracker_adminer_dev
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  backend:
    image: node:20
    container_name: timetracker_backend_dev
    working_dir: /app
    command: sh -c "npm ci --workspace=apps/backend && npm run start:dev --workspace=apps/backend"
    environment:
      - NODE_ENV=development
      - DB_PORT=5432
      - DB_HOST=postgres
      - DB_USER=yourusername
      - DB_PASSWORD=GvXWmzMLP03HNmrp
      - DB_NAME=nestdb
      - JWT_SECRET=DEV_SECRET_KEY
      - JWT_EXPIRES_IN=1d
      - DB_SYNCHRONIZE=true
      # Включаем polling-наблюдение для корректного hot-reload в Docker Desktop на Windows/Mac
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - TSC_WATCHFILE=UsePolling
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_app_node_modules:/app/apps/backend/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20
    container_name: timetracker_frontend_dev
    working_dir: /app
    command: sh -c "npm ci --workspace=apps/frontend && TAILWIND_DISABLE_OXIDE=1 npm run dev --workspace=apps/frontend -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
      - TAILWIND_DISABLE_OXIDE=1
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_app_node_modules:/app/apps/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  backend_node_modules:
  backend_app_node_modules:
  frontend_node_modules:
  frontend_app_node_modules: 